name: Mobile Smoke Tests

on:
  push:
    branches:
      - tests-only-branch
  pull_request:
    branches:
      - tests-only-branch

jobs:
  mobileSmokeTests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run mobileSmoke tests in random browser
        run: |
          # Список проектов, которые указаны в playwright.config.ts
          projects=("Mobile Chrome" "Mobile Chromium" "Mobile Edge")
          # Выбираем случайный проект
          PROJECT=${projects[$RANDOM % ${#projects[@]}]}
          echo "Running tests in project: $PROJECT"
          # Запуск тестов только для выбранного проекта
          npx playwright test --grep "@mobileSmoke" --project="$PROJECT"

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
