name: Mobile Smoke Tests

on:
  push:
    branches:
      - tests-only-branch
  pull_request:
    branches:
      - tests-only-branch

jobs:
  mobileSmokeTests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run mobileSmoke tests in random browser
        run: |
          npx playwright test --grep "@CheckPresenceOfGames" --reporter=html
        continue-on-error: true   # тесты могут падать, workflow продолжится

      - name: Zip Playwright Report
        if: always()
        run: |
          zip -r playwright-report.zip playwright-report

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report.zip
